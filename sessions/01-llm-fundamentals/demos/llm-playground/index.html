<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>AgentLab · LLM Deney Alanı</title><style>
[hidden]{display:none!important}:root{font-family:system-ui,sans-serif;color:#132339;background:#f1f5f9}body{max-width:920px;margin:auto;padding:24px}header{display:flex;align-items:center;justify-content:space-between;gap:1em}h1{margin-bottom:4px}p{line-height:1.5}.card{background:white;border:1px solid #d7e0eb;border-radius:14px;padding:20px;margin:16px 0;box-shadow:0 4px 14px #1433520d}button,select,input,textarea{font:inherit}button{border:0;background:#1458a5;color:white;border-radius:8px;padding:10px 16px;cursor:pointer}button:disabled{opacity:.6}select,input,textarea{border:1px solid #aabace;border-radius:7px;padding:8px}textarea{width:100%;box-sizing:border-box;min-height:110px}label{display:block;margin:12px 0 6px;font-weight:600}.controls{display:flex;flex-wrap:wrap;gap:14px}.controls input{width:76px}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#f3f6fa;padding:14px;border-radius:8px}.barrow{display:grid;grid-template-columns:minmax(110px,1fr) 3fr 60px;align-items:center;gap:8px;margin:8px 0}.track{background:#e5edf6;border-radius:4px;height:12px}.fill{background:#2878c7;height:100%;border-radius:4px}.tokens{display:flex;flex-wrap:wrap;gap:8px}.token{background:#eaf2fb;border-radius:8px;padding:8px}.hint{color:#415b76}.status{color:#12603c}a{color:#1458a5}
</style></head><body><header><div><h1>AgentLab</h1><p class="hint" id="subtitle"></p></div><select id="language" aria-label="Language"><option value="tr">Türkçe</option><option value="en">English</option></select></header><main><div class="card"><label id="mode-label" for="mode"></label><select id="mode"><option value="tokenize"></option><option value="generate"></option><option value="tool"></option></select><p id="description"></p><label id="text-label" for="text"></label><textarea id="text">Merhaba dünya! 👋</textarea><div id="settings" class="controls"><div><label for="temperature">Temperature</label><input id="temperature" type="number" min="0.01" max="2" step="0.1" value="0.8"></div><div><label for="top_k">Top-k</label><input id="top_k" type="number" min="1" max="200" value="20"></div><div><label for="top_p">Top-p</label><input id="top_p" type="number" min="0.01" max="1" step="0.05" value="0.9"></div><div><label id="max-label" for="max_tokens"></label><input id="max_tokens" type="number" min="1" max="128" value="32"></div></div><p><button id="run"></button> <span id="status" role="status"></span></p></div><div class="card"><h2 id="result-label"></h2><p id="help" class="hint"></p><div id="result"></div></div></main><script>
const translations={tr:{subtitle:'Gerçek modelle token, olasılık ve araç çağrısı deneyleri',mode:'Deney seçin',modes:['Tokenlaştırma','Üretim ve olasılıklar','Araç çağrısı'],descriptions:['Modelin kendi tokenizer’ı parçaları ve ID’leri döndürür.','Ham olasılıklarla örnekleme sonrası olasılıkları karşılaştırın. Tek adım için üretim sınırını 1 yapın.','Model önerir; yalnızca izin verilen lookup_term çağrısı doğrulanır ve çalıştırılır.'],text:'Metin veya soru',max:'Üretim sınırı',run:'Çalıştır',working:'Model çalışıyor…',done:'Tamamlandı',failed:'İşlem başarısız',result:'Sonuç',help:'Ham tablo ayrı bir isteğe, örnekleme sonrası tablo gösterilen üretimin ilk adımına aittir. Yalnızca ilk 8 aday gösterilir; eksik Unicode parçaları bayt listesi olabilir.'},en:{subtitle:'Explore tokens, probabilities and tool calls with a real model',mode:'Choose an experiment',modes:['Tokenization','Generation and probabilities','Tool calling'],descriptions:['The model tokenizer returns token pieces and IDs.','Compare raw and post-sampling probabilities. Set the generation limit to 1 for a single step.','The model proposes a call; only an allowed lookup_term call is validated and executed.'],text:'Text or question',max:'Generation limit',run:'Run',working:'Running model…',done:'Done',failed:'Request failed',result:'Result',help:'The raw table is a separate request; the post-sampling table is the first step of the displayed generation. At most 8 candidates are shown; partial Unicode pieces may be byte arrays.'}};
const $=id=>document.getElementById(id);function renderResult(data, requestMode){
 const target=$('result'), tr=$('language').value==='tr'; target.textContent='';
 function heading(text){const e=document.createElement('h3');e.textContent=text;target.append(e)}
 function block(value){const e=document.createElement('pre');e.textContent=typeof value==='string'?value:JSON.stringify(value,null,2);target.append(e)}
 function chart(rows, chosen){for(const row of rows){const wrap=document.createElement('div');wrap.className='barrow';const label=document.createElement('span');const byteNote=row.byte_status==='missing'?(tr?' · bayt bilgisi yok':' · bytes missing'):row.byte_status==='invalid'?(tr?' · bayt bilgisi geçersiz':' · invalid bytes'):row.byte_status==='mismatch'?(tr?' · bayt/parça uyuşmuyor':' · bytes/token mismatch'):'';label.textContent=JSON.stringify(row.token)+(Array.isArray(row.bytes)?' · bytes '+JSON.stringify(row.bytes):byteNote)+' · '+row.id+(chosen===row.id?(tr?' ← seçilen ilk token':' ← selected first token'):'');const track=document.createElement('div');track.className='track';const fill=document.createElement('div');fill.className='fill';fill.style.width=(Math.max(0,Math.min(1,row.prob))*100)+'%';track.append(fill);const pct=document.createElement('span');pct.textContent=(row.prob*100).toFixed(2)+'%';wrap.append(label,track,pct);target.append(wrap)}}
 if(requestMode==='tokenize'){heading((tr?'Token sayısı: ':'Token count: ')+data.tokens.length);const wrap=document.createElement('div');wrap.className='tokens';for(const token of data.tokens){const item=document.createElement('span');item.className='token';item.textContent=JSON.stringify(token.piece)+' · ID '+token.id;wrap.append(item)}target.append(wrap)}

 else if(requestMode==='generate'){
  heading(tr?'Üretilen metin':'Generated text');block(data.text);
  block((tr?'Girdi / üretilen / istenen token / sunucu bağlamı: ':'Input / generated / requested tokens / server context: ')+[data.input_tokens,data.generated_tokens,data.requested_tokens,data.context??'?'].join(' / '));
  block((tr?'Sunucunun durma nedeni: ':'Server stop reason: ')+(data.stop_type|| (tr?'bildirilmedi':'not reported')));
  if(data.truncated===true)block(tr?'Sunucu üretim sırasında bağlam sınırının aşıldığını bildirdi. Bu bayrak tek başına girdinin kısaltıldığını göstermez.':'The server reported that the context limit was exceeded during generation. This flag alone does not establish that the input was shortened.');
  else if(data.truncated===false)block(tr?'Sunucu bağlam sınırının aşıldığını bildirmedi.':'The server did not report exceeding the context limit.');
  else block(tr?'Sunucu bağlam sınırı durumunu bildirmedi.':'The server did not report the context limit status.');
  if(data.generated_tokens<data.requested_tokens)block(tr?'İstenen üretim bütçesinden önce durdu; nedeni için sunucu bilgisini inceleyin.':'Generation stopped before the requested budget; consult the server stop reason.');
  heading(tr?'Ham olasılıklar · ilk adım, ayrı istek':'Raw probabilities · first step, separate request');
  if(data.raw.length)chart(data.raw,null);if(data.raw_status!=='complete')block(tr?'Olasılık tablosu veya bayt bilgisi eksik ya da kullanılamıyor.':'The probability table or byte information is incomplete or unavailable.');
  heading(tr?'Örnekleme sonrası · bu üretimin ilk adımı':'Post-sampling · first step of this generation');
  if(data.sampled.length)chart(data.sampled,data.first_generated_id);if(data.sampled_status!=='complete')block(tr?'Olasılık tablosu veya bayt bilgisi eksik ya da kullanılamıyor.':'The probability table or byte information is incomplete or unavailable.');
  if(data.first_generated_id!==null)block((tr?'Üretilen ilk token ID: ':'First generated token ID: ')+data.first_generated_id);
 }
 else {heading(tr?'1. Model önerisi':'1. Model proposal');block(data.proposal);heading(tr?'2. Doğrulama':'2. Validation');block(data.verified?(tr?'İzin verilen çağrı':'Allowed call'):(tr?'Geçerli araç çağrısı yok; araç çalıştırılmadı.':'No valid tool call; no tool was run.'));if(data.verified){heading(tr?'3. Gerçek araç sonucu':'3. Actual tool result');block(data.result);heading(tr?'4. Modelin son yanıtı':'4. Model final answer');block(data.answer);if(data.additional_call_not_executed)block(tr?'Ek araç çağrısı çalıştırılmadı.':'An additional tool call was not executed.')}}
}
function update(){let t=translations[$('language').value], mode=$('mode'), index=mode.selectedIndex;document.documentElement.lang=$('language').value;$('subtitle').textContent=t.subtitle;$('mode-label').textContent=t.mode;[...mode.options].forEach((o,i)=>o.textContent=t.modes[i]);$('description').textContent=t.descriptions[index];$('text-label').textContent=t.text;$('max-label').textContent=t.max;$('run').textContent=t.run;$('result-label').textContent=t.result;$('help').textContent=t.help;$('settings').hidden=mode.value!=='generate'}$('language').onchange=update;$('mode').onchange=()=>{if($('mode').value==='tool')$('text').value='What is a token? Use lookup_term first.';update()};$('run').onclick=async()=>{let t=translations[$('language').value];$('run').disabled=true;$('status').textContent=t.working;$('result').textContent='';try{let body={mode:$('mode').value,text:$('text').value,temperature:Number($('temperature').value),top_k:Number($('top_k').value),top_p:Number($('top_p').value),max_tokens:Number($('max_tokens').value)};let response=await fetch(location.pathname,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});let result=await response.json();if(!response.ok)throw Error(result.error);renderResult(result,body.mode);$('status').textContent=t.done}catch(e){$('status').textContent=t.failed;$('result').textContent=e.message}finally{$('run').disabled=false}};update();
</script></body></html>
